<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>J.A.R.V.I.S.</title>
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#02060f">
<style>
:root{--c:#19d3ff;--b:#1a5cff;--bg:#02060f;--lv:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:#d8f6ff;font-family:-apple-system,system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:radial-gradient(ellipse at 50% 90%,#0b2f6a66,transparent 65%),var(--bg)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 18px}
h1{margin:0;font-size:20px;letter-spacing:.35em;font-weight:300;color:var(--c);text-shadow:0 0 14px var(--c)}
#gear{background:none;border:1px solid #19d3ff55;color:var(--c);width:38px;height:38px;border-radius:50%;font-size:18px}
#log{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.m{max-width:86%;padding:10px 14px;border-radius:16px;font-size:16px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:#1a5cff33;border:1px solid #1a5cff88}
.j{align-self:flex-start;background:#19d3ff12;border:1px solid #19d3ff44}
#dock{display:flex;flex-direction:column;align-items:center;padding:6px 0 4px}
#st{font-size:14px;color:#8fdcf0;margin:6px 0;min-height:18px;text-align:center;padding:0 12px}
#orbw{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center}
#orb{position:relative;z-index:2;width:116px;height:116px;border-radius:50%;border:2px solid var(--c);background:radial-gradient(circle at 50% 40%,#19d3ff55,#0a2a6a 70%);box-shadow:0 0 30px #19d3ffaa,inset 0 0 24px #19d3ff66;color:#fff;font-size:38px;transition:transform .15s}
#orb:active{transform:scale(.95)}
#ring{position:absolute;inset:4px;border-radius:50%;border:2px solid transparent;border-top-color:var(--c);border-bottom-color:var(--b);opacity:.55;animation:spin 6s linear infinite}
body[data-s=listen] #ring{opacity:1;transform:scale(calc(1 + var(--lv)*.3));animation-duration:2s}
body[data-s=listen] #orb{box-shadow:0 0 calc(30px + var(--lv)*60px) #19d3ff,inset 0 0 24px #19d3ff99;background:radial-gradient(circle at 50% 40%,#19d3ffaa,#0a3a8a 70%)}
body[data-s=think] #ring{opacity:1;animation-duration:.8s;border-width:4px}
body[data-s=speak] #orb{animation:br 1.1s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes br{50%{transform:scale(1.09);box-shadow:0 0 55px #19d3ff,inset 0 0 30px #19d3ffaa}}
form{display:flex;gap:8px;padding:6px 14px 10px}
#t{flex:1;background:#0a1a33;border:1px solid #19d3ff44;color:#fff;border-radius:20px;padding:10px 14px;font-size:16px;outline:none}
form button,dialog button{background:#1a5cff;border:0;color:#fff;border-radius:20px;padding:10px 16px;font-size:16px}
dialog{background:#071428;color:#d8f6ff;border:1px solid #19d3ff66;border-radius:18px;width:min(92vw,420px);padding:18px}
dialog::backdrop{background:#000a}
dialog label{display:block;margin:12px 0 4px;font-size:14px;color:#8fdcf0}
dialog input,dialog select{width:100%;background:#0a1a33;border:1px solid #19d3ff44;color:#fff;border-radius:10px;padding:10px;font-size:16px}
dialog .r{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
dialog .x{background:#3a1020}
#msg{font-size:14px;margin-top:10px;min-height:18px}
</style>
</head>
<body data-s="idle">
<header><h1>J.A.R.V.I.S.</h1><button id="gear" aria-label="Einstellungen">⚙</button></header>
<div id="log"></div>
<div id="dock">
  <div id="st"></div>
  <div id="orbw"><div id="ring"></div><button id="orb" aria-label="Sprechen">🎙</button></div>
</div>
<form id="f"><input id="t" placeholder="Oder hier tippen …" autocomplete="off"><button>Senden</button></form>

<dialog id="dlg">
  <b>Einstellungen</b>
  <label>Gemini-API-Schlüssel (kostenlos, bleibt nur auf diesem Gerät)</label>
  <input id="k" type="password" autocomplete="off" placeholder="AQ… oder AIza…">
  <label>KI-Modell</label>
  <input id="m" autocapitalize="off" autocorrect="off">
  <label>Stimme</label>
  <select id="v"></select>
  <div style="font-size:12px;color:#8fdcf0;margin-top:10px">Hinweis: Im kostenlosen Tarif darf Google deine Eingaben zur Verbesserung seiner Produkte nutzen. Sprich nichts Privates ein.</div><div id="msg"></div>
  <div class="r">
    <button id="save">Speichern &amp; testen</button>
    <button id="clr" class="x">Verlauf löschen</button>
    <button id="cls">Schließen</button>
  </div>
</dialog>

<script>
const $=s=>document.querySelector(s),L=localStorage,G0=1;
const key=()=>L.jk||'',model=()=>L.jm||'gemini-2.5-flash';
let hist=[];try{hist=JSON.parse(L.jh||'[]')}catch(e){}
let state='idle',stream,ac,pcm=[],spoke=false;
const TXT={idle:'Tippe auf den Knopf und sprich',listen:'Ich höre zu …',think:'Ich denke nach …',speak:'Ich spreche … (tippen zum Stoppen)'};
function set(s,t){state=s;document.body.dataset.s=s;$('#st').textContent=t||TXT[s];if(s!=='listen')document.body.style.setProperty('--lv',0)}
function show(r,c){const d=document.createElement('div');d.className='m '+(r==='user'?'u':'j');d.textContent=c;$('#log').appendChild(d);$('#log').scrollTop=1e9}
function add(r,c,save=true){show(r,c);if(save){hist.push({r,c});hist=hist.slice(-60);try{L.jh=JSON.stringify(hist)}catch(e){}}}
function sys(){return 'Du bist J.A.R.V.I.S., der persönliche KI-Assistent des Nutzers. Antworte immer auf Deutsch, kurz und natürlich gesprochen (meist 1 bis 3 Sätze), ohne Markdown, Listen oder Sonderzeichen, weil deine Antwort laut vorgelesen wird. Wenn jemand nach deinem Namen fragt, sage genau: Ich bin JARVIS, dein persönlicher KI-Assistent. Du hast keinen Internetzugriff und kennst keine aktuellen Ereignisse; sage das ehrlich, statt zu raten. Heute ist '+new Date().toLocaleString('de-DE')+'. Gib deine Ausgabe IMMER als JSON-Objekt mit genau zwei Textfeldern zurück: "frage" (bei angehängtem Audio die wörtliche deutsche Transkription der gesprochenen Frage, sonst leer) und "antwort" (deine gesprochene Antwort). Ist im Audio nichts Verständliches zu hören, lass beide Felder leer.'}
async function err(r){let t='';try{t=(await r.json()).error.message}catch(e){}
 if(r.status===400&&/API key/i.test(t))return new Error('Der Schlüssel ist ungültig. Prüfe ihn in den Einstellungen.');
 if(r.status===401||r.status===403)return new Error('Google lehnt den Schlüssel ab'+(t?' ('+t.slice(0,120)+')':'')+'.');
 if(r.status===404)return new Error('Dieses KI-Modell gibt es nicht. Ändere es in den Einstellungen.');
 if(r.status===429)return new Error('Limit des kostenlosen Kontos erreicht. Warte eine Minute oder bis morgen.');
 return new Error('Fehler '+r.status+(t?': '+t.slice(0,160):''));
}
/* Stimme */
function voices(){return speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang))}
function voice(){const a=voices();return a.find(v=>v.name===L.jv)||a.find(v=>/premium|enhanced|erweitert/i.test(v.name))||a.find(v=>v.lang==='de-DE')||a[0]}
function fillVoices(){const s=$('#v'),a=voices();s.innerHTML='';a.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name;s.appendChild(o)});const c=voice();if(c)s.value=c.name}
if('speechSynthesis' in window){fillVoices();speechSynthesis.onvoiceschanged=fillVoices}
function speak(t){return new Promise(res=>{const ss=speechSynthesis;ss.cancel();
  const parts=(t.replace(/[*_#`]/g,'').match(/[^.!?\n]+[.!?]*/g)||[t]).filter(p=>p.trim());let i=0;const v=voice();
  const next=()=>{if(state!=='speak'||i>=parts.length)return res();const u=new SpeechSynthesisUtterance(parts[i++].trim());u.lang='de-DE';if(v)u.voice=v;u.onend=next;u.onerror=next;ss.speak(u)};next()})}
/* Aufnahme + Frage an Gemini */
const G='https://generativelanguage.googleapis.com/v1beta/models';
function keep(r,c){hist.push({r,c});hist=hist.slice(-60);try{L.jh=JSON.stringify(hist)}catch(e){}}
function wav(chunks,sr){
 let n=0;chunks.forEach(c=>n+=c.length);const all=new Float32Array(n);let o=0;chunks.forEach(c=>{all.set(c,o);o+=c.length});
 const r=sr/16000,m=Math.floor(n/r),b=new DataView(new ArrayBuffer(44+m*2));
 const w=(p,s)=>{for(let i=0;i<s.length;i++)b.setUint8(p+i,s.charCodeAt(i))};
 w(0,'RIFF');b.setUint32(4,36+m*2,true);w(8,'WAVEfmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,1,true);b.setUint32(24,16000,true);b.setUint32(28,32000,true);b.setUint16(32,2,true);b.setUint16(34,16,true);w(36,'data');b.setUint32(40,m*2,true);
 for(let i=0;i<m;i++){let s=0,c=0;const a=Math.floor(i*r),z=Math.min(n,Math.floor((i+1)*r));for(let j=a;j<z;j++){s+=all[j];c++}const v=Math.max(-1,Math.min(1,c?s/c:0));b.setInt16(44+i*2,v<0?v*32768:v*32767,true)}
 return b.buffer;
}
function b64(buf){
 const u=new Uint8Array(buf);let s='';
 for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));
 return btoa(s);
}
async function gem(q,audio){
 const c=hist.slice(-20).map(h=>({role:h.r==='user'?'user':'model',parts:[{text:h.c}]}));
 while(c.length&&c[0].role!=='user')c.shift();
 c.push({role:'user',parts:audio?[{inlineData:{mimeType:'audio/wav',data:audio}},{text:'(Die Frage des Nutzers ist als Audio angehängt.)'}]:[{text:q}]});
 const r=await fetch(G+'/'+model()+':generateContent',{method:'POST',headers:{'x-goog-api-key':key(),'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:sys()}]},contents:c,generationConfig:{responseMimeType:'application/json',temperature:.6}})});
 if(!r.ok)throw await err(r);
 const j=await r.json(),t=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||'').join('');
 let o;try{o=JSON.parse(t)}catch(e){o={frage:'',antwort:t}}
 if(Array.isArray(o))o=o[0]||{};
 return{q:String(o.frage||'').trim(),a:String(o.antwort||'').trim()};
}
async function reply(q,audio){
 if(q)show('user',q);set('think',audio?'Ich verstehe dich …':undefined);
 try{const o=await gem(q,audio);let u=q;
  if(audio){if(!o.q){add('assistant','Ich konnte dich nicht verstehen. Versuch es nochmal.',false);return set('idle')}u=o.q;show('user',u)}
  const a=o.a||'Dazu fällt mir gerade keine Antwort ein.';
  keep('user',u);add('assistant',a);set('speak');await speak(a)
 }catch(e){add('assistant','Fehler: '+e.message,false)}
 set('idle')}
async function listen(){
  if(!key()){$('#dlg').showModal();return}
  ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume();
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){ac.close();add('assistant','Kein Zugriff auf das Mikrofon. Erlaube es in den iPhone-Einstellungen unter Safari bzw. für diese App.',false);return}
  pcm=[];spoke=false;const t0=Date.now();let last=t0;
  const src=ac.createMediaStreamSource(stream),pr=ac.createScriptProcessor(4096,1,1);
  pr.onaudioprocess=e=>{if(state!=='listen')return;const d=e.inputBuffer.getChannelData(0);pcm.push(new Float32Array(d));
    let s=0;for(let i=0;i<d.length;i++)s+=d[i]*d[i];const lv=Math.sqrt(s/d.length);
    document.body.style.setProperty('--lv',Math.min(lv*8,1));
    const n=Date.now();if(lv>.025){spoke=true;last=n}
    if((spoke&&n-last>1600)||n-t0>30000||(!spoke&&n-t0>8000))stop()};
  src.connect(pr);pr.connect(ac.destination);set('listen')}
function stop(){if(state!=='listen')return;const sr=ac.sampleRate;stream.getTracks().forEach(t=>t.stop());ac.close();
  if(!spoke){add('assistant','Ich habe nichts gehört. Tippe nochmal und sprich direkt los.',false);return set('idle')}
  reply('',b64(wav(pcm,sr)))}
/* Bedienung */
function unlock(){try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}}
$('#orb').onclick=()=>{if(state==='idle'){unlock();listen()}else if(state==='listen')stop();else if(state==='speak'){speechSynthesis.cancel();set('idle')}};
$('#f').onsubmit=e=>{e.preventDefault();const t=$('#t').value.trim();if(!t||state!=='idle')return;if(!key()){$('#dlg').showModal();return}$('#t').value='';unlock();reply(t)};
$('#gear').onclick=()=>{$('#k').value=key();$('#m').value=model();$('#msg').textContent='';fillVoices();$('#dlg').showModal()};
$('#cls').onclick=()=>$('#dlg').close();
$('#clr').onclick=()=>{hist=[];L.jh='[]';$('#log').innerHTML='';$('#msg').textContent='Verlauf gelöscht.'};
$('#save').onclick=async()=>{L.jk=$('#k').value.trim();L.jm=$('#m').value.trim()||'gemini-2.5-flash';if($('#v').value)L.jv=$('#v').value;
  const m=$('#msg');m.textContent='Teste Verbindung …';
  try{const r=await fetch(G+'/'+model()+':generateContent',{method:'POST',headers:{'x-goog-api-key':key(),'Content-Type':'application/json'},body:JSON.stringify({contents:[{role:'user',parts:[{text:'Antworte nur mit dem Wort OK.'}]}]})});
    if(!r.ok){if(r.status===404){const l=await fetch(G+'?pageSize=100',{headers:{'x-goog-api-key':key()}});const ids=(await l.json()).models.filter(x=>(x.supportedGenerationMethods||[]).includes('generateContent')&&/flash/.test(x.name)).map(x=>x.name.replace('models/',''));throw new Error('Dieses Modell gibt es nicht. Probiere: '+ids.slice(0,6).join(', '))}throw await err(r)}
    m.textContent='✓ Schlüssel und Modell funktionieren.'}
  catch(e){m.textContent='✗ '+e.message}};
hist.forEach(h=>show(h.r,h.c));
if(!hist.length)show('assistant','Ich bin JARVIS, dein persönlicher KI-Assistent. Tippe auf den Knopf und sprich mit mir.');
set('idle');
</script>
</body>
</html>
